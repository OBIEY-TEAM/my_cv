version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: luka_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lukamosala}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luka_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - SUPABASE_DATABASE_URL=${SUPABASE_DATABASE_URL:-}
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lukamosala}}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./agent-ia:/app/agent-ia

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luka_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
